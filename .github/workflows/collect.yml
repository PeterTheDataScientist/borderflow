name: collect

# Twice daily. PortWatch publishes once a day, so two attempts is not greed, it
# is the cheapest insurance against a single transient failure putting a hole in
# a series whose only value is being unbroken.
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:

# Scheduled workflows on a public repository are disabled after 60 days of
# inactivity. This job commits on most runs, which keeps the repository active
# and the schedule alive. That is a real dependency, so it is written down here
# rather than discovered in six months when the series has silently stopped.

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Collect
        run: python -m borderflow.cli --data data

      - name: Commit whatever changed
        run: |
          git config user.name  "borderflow-bot"
          git config user.email "noreply@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
