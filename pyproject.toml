[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "borderflow"
version = "0.1.0"
description = "Corridor state for Southern Africa: seaport throughput published daily, border forecasts withheld until they can be scored"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Peter Tinashe Mundowa" }]
dependencies = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/borderflow"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 88
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
